name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, bcmath, fileinfo
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Environment File
        run: |
          cp .env.example .env
          mkdir -p database
          touch database/database.sqlite

      - name: Install PHP Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate App Key
        run: php artisan key:generate --ansi --no-interaction

      - name: Run Migrations
        run: php artisan migrate --force --no-interaction

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Frontend Assets
        run: npm run build

      - name: Run ESLint Check
        run: npm run lint:check

      - name: Run Prettier Check
        run: npm run format:check

      - name: Run TypeScript Check
        run: npm run types:check

      - name: Run Pint Code Style Check
        run: vendor/bin/pint --test

      - name: Run PHPStan Static Analysis
        run: php -d memory_limit=1024M vendor/bin/phpstan analyse --memory-limit=1024M

      - name: Run Pest Test Suite
        run: php artisan test
